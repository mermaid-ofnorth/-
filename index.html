<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кибербуллинг: Личный выбор</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #0a0e14;
    --panel: #0d1117;
    --panel-2: #161b22;
    --border: #21262d;
    --border-2: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --evidence: #d2a8ff;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: 
      radial-gradient(circle at 20% 10%, rgba(88, 166, 255, 0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255, 88, 88, 0.06), transparent 40%);
  }

  #game {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    position: relative;
  }

  @media (min-width: 700px) {
    #game { border-radius: 16px; height: 92vh; max-height: 820px; }
  }

  #header {
    padding: 12px 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    gap: 8px;
  }

  #header .title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 1;
  }

  #header .stats {
    display: flex;
    gap: 8px;
    font-size: 10px;
    color: var(--text-dim);
    align-items: center;
    flex-shrink: 0;
  }

  #header .stat { display: flex; align-items: center; gap: 3px; }
  #header .stat b { color: var(--text); font-weight: 700; font-size: 11px; }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--border-2);
    color: var(--text-dim);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    position: relative;
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.active { border-color: var(--good); color: var(--good); }
  .icon-btn.muted { border-color: var(--bad); color: var(--bad); }
  .icon-btn.evidence-btn { border-color: rgba(210, 168, 255, 0.4); color: var(--evidence); }
  .icon-btn.evidence-btn:hover { border-color: var(--evidence); background: rgba(210, 168, 255, 0.08); }

  .icon-btn.evidence-btn .badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--evidence);
    color: #0d1117;
    font-size: 9px;
    font-weight: 700;
    min-width: 15px;
    height: 15px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  #trust-bar {
    width: 100%;
    height: 3px;
    background: var(--border);
    flex-shrink: 0;
  }

  #trust-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--bad), var(--warn), var(--good));
    transition: width 0.6s ease;
  }

  #content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  #content::-webkit-scrollbar { width: 6px; }
  #content::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

  .msg {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    animation: fadeIn 0.5s ease;
    word-wrap: break-word;
    white-space: pre-line;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.author {
    align-self: flex-start;
    background: var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg.author .name {
    display: block;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 3px;
  }

  .msg.system {
    align-self: center;
    background: transparent;
    border: 1px dashed var(--border-2);
    color: var(--text-dim);
    font-size: 12px;
    font-style: italic;
    text-align: center;
    max-width: 95%;
    padding: 8px 12px;
  }

  .msg.danger {
    align-self: flex-start;
    background: rgba(248, 81, 73, 0.12);
    border: 1px solid rgba(248, 81, 73, 0.35);
    border-bottom-left-radius: 4px;
  }

  .msg.danger .name { color: var(--bad); }

  .msg.evidence {
    align-self: center;
    background: rgba(210, 168, 255, 0.12);
    border: 1px solid rgba(210, 168, 255, 0.4);
    color: var(--evidence);
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    max-width: 90%;
    padding: 8px 14px;
    border-radius: 20px;
  }

  .msg.you {
    align-self: flex-end;
    background: #1f6feb;
    border-bottom-right-radius: 4px;
    color: #fff;
  }

  .msg.you-bad {
    align-self: flex-end;
    background: #7a1f1f;
    border-bottom-right-radius: 4px;
    color: #ffd7d7;
    border: 1px solid rgba(248, 81, 73, 0.5);
  }

  .msg.thought {
    align-self: flex-end;
    background: transparent;
    border: 1px dashed #4a5568;
    color: #a0aec0;
    font-style: italic;
    font-size: 12.5px;
    border-bottom-right-radius: 4px;
    max-width: 88%;
  }

  .msg.teacher {
    align-self: flex-start;
    background: rgba(63, 185, 80, 0.12);
    border: 1px solid rgba(63, 185, 80, 0.35);
    border-bottom-left-radius: 4px;
  }

  .msg.teacher .name {
    display: block;
    font-size: 11px;
    color: var(--good);
    font-weight: 700;
    margin-bottom: 3px;
  }

  #choices {
    padding: 14px 16px 18px;
    background: var(--panel-2);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
    max-height: 50%;
    overflow-y: auto;
  }

  #choices::-webkit-scrollbar { width: 4px; }
  #choices::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

  .choice-btn {
    text-align: left;
    padding: 12px 14px;
    background: var(--border);
    border: 1px solid var(--border-2);
    color: var(--text);
    border-radius: 10px;
    font-size: 13.5px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
    line-height: 1.4;
    min-height: 46px;
  }

  .choice-btn:hover {
    background: #2d333b;
    border-color: var(--accent);
    transform: translateX(3px);
  }

  .choice-btn:active { transform: scale(0.98); }

  .choice-btn.danger-choice:hover {
    border-color: var(--bad);
    background: rgba(248, 81, 73, 0.1);
  }

  .choice-btn.evidence-choice {
    border-color: rgba(210, 168, 255, 0.3);
  }

  .choice-btn.evidence-choice:hover {
    border-color: var(--evidence);
    background: rgba(210, 168, 255, 0.08);
  }

  .choice-btn .hint {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
    font-style: italic;
  }

  .end-screen {
    text-align: left;
    padding: 20px 4px;
    animation: fadeIn 0.8s ease;
  }

  .end-screen h1 {
    font-size: 22px;
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-align: center;
  }

  .end-screen .rank {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0.7;
    text-align: center;
    display: block;
  }

  .end-screen p {
    font-size: 13.5px;
    line-height: 1.7;
    color: #c9d1d9;
    margin-bottom: 14px;
  }

  .end-screen .btn {
    display: inline-block;
    margin-top: 14px;
    margin-right: 8px;
    padding: 12px 22px;
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .end-screen .btn:hover { background: #2ea043; }
  .end-screen .btn.secondary { background: var(--border-2); }
  .end-screen .btn.secondary:hover { background: #444c56; }
  .end-screen .btn.pdf { background: #b62324; }
  .end-screen .btn.pdf:hover { background: #d32f2f; }

  .end-good h1 { color: var(--good); }
  .end-neutral h1 { color: var(--warn); }
  .end-bad h1 { color: var(--bad); }

  .divider { height: 1px; background: var(--border); margin: 18px 0; }

  .warning-block {
    background: rgba(248, 81, 73, 0.08);
    border: 1px solid rgba(248, 81, 73, 0.3);
    border-left: 4px solid var(--bad);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 16px 0;
  }

  .warning-block .warning-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--bad);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .warning-block p {
    font-size: 12.5px !important;
    color: #c9d1d9;
    line-height: 1.65;
    margin-bottom: 10px !important;
  }

  .warning-block p:last-child { margin-bottom: 0 !important; }
  .warning-block strong { color: #fff; }

  .law-list { margin: 10px 0 0 0; padding-left: 0; list-style: none; }

  .law-item {
    font-size: 12px;
    color: #c9d1d9;
    line-height: 1.6;
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 6px;
    margin-bottom: 6px;
    border-left: 3px solid var(--bad);
  }

  .law-item .law-name { color: var(--bad); font-weight: 700; font-size: 11.5px; }
  .law-item .law-penalty { color: #f0b8b8; font-size: 11px; margin-top: 3px; display: block; }

  .responsibility-note {
    background: rgba(248, 81, 73, 0.15);
    border: 1px solid var(--bad);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 12px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #f0b8b8;
    text-align: center;
  }

  .responsibility-note strong { color: #fff; }

  .certificate {
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 28px 24px;
    margin: 22px 0;
    position: relative;
    overflow: hidden;
    color: #1a1a1a;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .certificate::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #1e7c3a, #2b7cbf);
  }

  .certificate-inner { position: relative; z-index: 1; }

  .cert-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 22px;
    padding-bottom: 16px;
    border-bottom: 2px solid #e5e7eb;
  }

  .cert-org { font-size: 10px; letter-spacing: 3px; color: #2b7cbf; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
  .cert-org-sub { font-size: 9px; color: #6b7280; letter-spacing: 1px; }
  .cert-logo { font-size: 28px; line-height: 1; color: #1e7c3a; }

  .cert-label { font-size: 10px; letter-spacing: 4px; color: #6b7280; text-transform: uppercase; text-align: center; margin-bottom: 10px; }
  .cert-title { font-size: 21px; font-weight: 700; text-align: center; color: #111827; line-height: 1.25; margin-bottom: 20px; }
  .cert-presented { font-size: 11px; color: #6b7280; text-align: center; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .cert-name { font-size: 22px; font-weight: 700; text-align: center; color: #111827; margin-bottom: 4px; word-break: break-word; }
  .cert-name-line { height: 2px; width: 60%; margin: 0 auto 22px; background: linear-gradient(90deg, transparent, #1e7c3a, transparent); }
  .cert-desc { font-size: 12px; color: #374151; line-height: 1.7; text-align: center; margin-bottom: 22px; padding: 0 6px; }
  .cert-desc strong { color: #1e7c3a; }

  .cert-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
  .cert-stat { background: #f0f7ff; border: 1.5px solid #2b7cbf; border-radius: 6px; padding: 10px 12px; text-align: center; }
  .cert-stat-label { font-size: 9px; color: #6b7280; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; }
  .cert-stat-value { font-size: 16px; font-weight: 700; color: #2b7cbf; }

  .cert-result { text-align: center; margin-bottom: 18px; }
  .cert-result-label { font-size: 9px; color: #6b7280; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .cert-result-value { font-size: 15px; color: #1e7c3a; font-weight: 700; }

  .cert-footer-clean { display: flex; justify-content: center; align-items: center; gap: 32px; padding-top: 16px; border-top: 2px solid #e5e7eb; flex-wrap: wrap; }
  .cert-meta-block { font-size: 10px; color: #6b7280; line-height: 1.6; text-align: center; }
  .cert-meta-block b { color: #111827; font-weight: 600; }
  .cert-id { font-family: 'Courier New', monospace; color: #2b7cbf; font-size: 10px; letter-spacing: 1px; font-weight: 700; }

  #author-credit {
    padding: 6px 16px 10px;
    text-align: center;
    font-size: 9px;
    color: #4a5360;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    user-select: none;
    opacity: 0.7;
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
    animation: fadeIn 0.2s ease;
  }

  .modal-content {
    background: var(--panel-2);
    border: 1px solid var(--border-2);
    border-radius: 12px;
    padding: 24px;
    max-width: 460px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    text-align: center;
  }

  .modal-content h2 { font-size: 17px; margin-bottom: 10px; color: var(--accent); }
  .modal-content p { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.6; }
  .modal-content input {
    width: 100%;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--border-2);
    color: var(--text);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 14px;
    outline: none;
  }
  .modal-content input:focus { border-color: var(--accent); }
  .modal-content .btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-content .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .evidence-list { text-align: left; margin-top: 14px; }
  .evidence-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    background: rgba(210, 168, 255, 0.05);
    border: 1px solid rgba(210, 168, 255, 0.2);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .evidence-icon { font-size: 20px; flex-shrink: 0; line-height: 1; }
  .evidence-text { flex: 1; }
  .evidence-title { font-size: 13px; font-weight: 700; color: var(--evidence); margin-bottom: 3px; }
  .evidence-desc { font-size: 11.5px; color: var(--text-dim); line-height: 1.5; }

  .evidence-empty {
    text-align: center;
    padding: 20px;
    color: var(--text-dim);
    font-size: 12.5px;
    font-style: italic;
  }

  @media (max-width: 500px) {
    #header .stats { font-size: 9px; gap: 5px; }
    #header .title { font-size: 10px; letter-spacing: 0.5px; }
    .msg { font-size: 13.5px; max-width: 92%; }
    .choice-btn { font-size: 13px; padding: 11px 12px; }
    #content { padding: 16px 12px; }
    #choices { padding: 12px 12px 14px; }
    .certificate { padding: 20px 16px; }
    .cert-title { font-size: 17px; }
    .cert-name { font-size: 18px; }
    .cert-desc { font-size: 11px; }
    .end-screen .btn { font-size: 12px; padding: 10px 16px; }
    .cert-stats { gap: 8px; }
    .warning-block { padding: 12px; }
    .law-item { font-size: 11px; }
  }

  #game:fullscreen { max-width: 100%; height: 100vh; border-radius: 0; border: none; }
  #game:-webkit-full-screen { max-width: 100%; height: 100vh; border-radius: 0; border: none; }

  @media print {
    body { background: #fff !important; }
    #header, #trust-bar, #choices, #author-credit { display: none !important; }
    #game { box-shadow: none !important; border: none !important; max-width: 100% !important; height: auto !important; background: #fff !important; }
    #content { overflow: visible !important; padding: 0 !important; }
    .certificate { box-shadow: none !important; border: 1.5px solid #1e7c3a !important; page-break-inside: avoid; margin: 0 auto !important; }
    .end-screen .btn { display: none !important; }
    .end-screen h1, .end-screen .rank, .end-screen p, .divider, .warning-block { display: none !important; }
  }
</style>
</head>
<body>

<div id="game">
  <div id="header">
    <div class="title">📱 Кибербуллинг: Личный выбор</div>
    <div class="stats">
      <span class="stat">🤝 <b id="trust-val">0</b></span>
      <span class="stat">📁 <b id="evid-val">0</b>/6</span>
      <span class="stat">📅 <b id="day-val">1</b></span>
    </div>
    <button class="icon-btn evidence-btn" id="evidence-btn" title="Папка с доказательствами">
      📁<span class="badge" id="evidence-badge">0</span>
    </button>
    <button class="icon-btn" id="sound-btn" title="Звук">🔊</button>
    <button class="icon-btn" id="fs-btn" title="На весь экран">⛶</button>
  </div>
  <div id="trust-bar"><div id="trust-fill"></div></div>

  <div id="content"></div>
  <div id="choices"></div>

  <div id="author-credit">© Чеботарева Ю.А., КИП ФИН, 2026</div>
</div>

<script>
const SPEED = {
  base: 2200,
  slow: 2800,
  fast: 1800,
  pause: 1600,
  longPause: 2400,
  shortPause: 1000
};

const Audio = {
  ctx: null, enabled: true, ambientNodes: [],
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { this.enabled = false; } } },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  startAmbient() {
    if (!this.ctx || !this.enabled || this.ambientNodes.length) return;
    const bufferSize = 2 * this.ctx.sampleRate;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
    const source = this.ctx.createBufferSource();
    source.buffer = buffer; source.loop = true;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 800;
    const gain = this.ctx.createGain(); gain.gain.value = 0.015;
    source.connect(filter).connect(gain).connect(this.ctx.destination);
    source.start();
    this.ambientNodes = [source, filter, gain];
  },
  stopAmbient() { this.ambientNodes.forEach(n => { try { n.stop?.(); n.disconnect?.(); } catch(e){} }); this.ambientNodes = []; },
  notify() {
    if (!this.ctx || !this.enabled) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.08, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
    o.connect(g).connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + 0.2);
  },
  alarm() {
    if (!this.ctx || !this.enabled) return;
    [0, 0.15, 0.3].forEach((t, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'square'; o.frequency.value = i % 2 === 0 ? 220 : 180;
      g.gain.setValueAtTime(0.05, this.ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + t + 0.12);
      o.connect(g).connect(this.ctx.destination);
      o.start(this.ctx.currentTime + t); o.stop(this.ctx.currentTime + t + 0.12);
    });
  },
  click() {
    if (!this.ctx || !this.enabled) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.value = 660;
    g.gain.setValueAtTime(0.04, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
    o.connect(g).connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.08);
  },
  pickup() {
    if (!this.ctx || !this.enabled) return;
    [660, 990].forEach((f, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t = this.ctx.currentTime + i * 0.08;
      g.gain.setValueAtTime(0.05, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g).connect(this.ctx.destination);
      o.start(t); o.stop(t + 0.2);
    });
  },
  success() {
    if (!this.ctx || !this.enabled) return;
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t = this.ctx.currentTime + i * 0.12;
      g.gain.setValueAtTime(0.06, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      o.connect(g).connect(this.ctx.destination);
      o.start(t); o.stop(t + 0.4);
    });
  },
  toggle() {
    this.enabled = !this.enabled;
    if (this.enabled) { this.resume(); this.startAmbient(); } else this.stopAmbient();
    return this.enabled;
  }
};

function updateHUD() {
  document.getElementById('trust-val').textContent = Math.max(0, Math.min(100, state.trust));
  document.getElementById('evid-val').textContent = state.evidence;
  document.getElementById('day-val').textContent = state.day;

  document.getElementById('evidence-badge').textContent = state.evidence;
}

function clearScreen() { content.innerHTML = ''; choicesBox.innerHTML = ''; }
function scrollDown() { content.scrollTop = content.scrollHeight; }

function addMsg(text, type = 'system', name = null) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (name) { const n = document.createElement('span'); n.className = 'name'; n.textContent = name; div.appendChild(n); }
  div.appendChild(document.createTextNode(text));
  content.appendChild(div); scrollDown();
}

function wait(ms) { return new Promise(res => setTimeout(res, ms)); }

async function sequence(messages, delay = SPEED.base) {
  for (const m of messages) {
    if (m.delay) await wait(m.delay);
    addMsg(m.text, m.type || 'system', m.name);
    if (m.type === 'danger') Audio.notify();
    if (m.type === 'evidence') Audio.pickup();
    const typeMultiplier = m.type === 'danger' ? 1.3 : m.type === 'thought' ? 1.5 : 1;
    await wait(delay * typeMultiplier);
  }
}

function showChoices(list) {
  choicesBox.innerHTML = '';
  list.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (choice.danger ? ' danger-choice' : '') + (choice.evidence ? ' evidence-choice' : '');
    btn.innerHTML = choice.text + (choice.hint ? `<span class="hint">${choice.hint}</span>` : '');
    btn.onclick = () => { Audio.click(); choicesBox.innerHTML = ''; choice.action(); };
    choicesBox.appendChild(btn);
  });
}

function changeTrust(d) { state.trust += d; updateHUD(); Save.save(); }
function increaseComplicity(n = 1) { state.complicity = Math.min(5, state.complicity + n); Save.save(); }

function addEvidence(key) {
  if (state.evidenceItems.includes(key)) return false;
  if (state.evidence >= 6) return false;
  const item = EVIDENCE_DB[key];
  if (!item) return false;
  state.evidenceItems.push(key);
  state.evidence = state.evidenceItems.length;
  updateHUD(); Save.save();
  addMsg(`📁 +1 улика: ${item.title}`, 'evidence');
  Audio.pickup();
  return true;
}

    document.body.appendChild(modal);
    const input = modal.querySelector('#name-input');
    const btn = modal.querySelector('#name-btn');
    input.addEventListener('input', () => { btn.disabled = input.value.trim().length < 2; });
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !btn.disabled) btn.click(); });
    btn.onclick = () => { const val = input.value.trim(); if (val.length < 2) return; state.playerName = val; Save.saveName(val); modal.remove(); resolve(val); };
    setTimeout(() => input.focus(), 200);
  });
}

    const btnPdf = document.createElement('button');
    btnPdf.className = 'btn pdf';
    btnPdf.textContent = '📄 Скачать сертификат (PDF)';
    btnPdf.onclick = async () => {
      btnPdf.disabled = true;
      btnPdf.textContent = '⏳ Готовим PDF...';
      const ok = await exportCertificatePDF(certData);
      btnPdf.disabled = false;
      btnPdf.textContent = ok ? '✅ Скачано!' : '📄 Скачать сертификат (PDF)';
      if (ok) setTimeout(() => btnPdf.textContent = '📄 Скачать сертификат (PDF)', 2500);
    };
    btnRow.appendChild(btnPdf);
  }

  div.appendChild(btnRow);
  content.appendChild(div);
  scrollDown();
}

function buildCertificateData(endingTitle) {
  const id = 'KB-' + Date.now().toString(36).toUpperCase().slice(-8) + '-' + Math.random().toString(36).slice(2, 5).toUpperCase();
  const date = new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' });
  return { id, name: state.playerName, ending: endingTitle, trust: Math.max(0, state.trust), evidence: state.evidence, date };
}

    addMsg('Куратор: «Дима взял академический отпуск по состоянию здоровья».', 'danger');
    changeTrust(-30);
    await wait(SPEED.longPause);
    return endScreen(
      'ИСЧЕЗНОВЕНИЕ', 'Плохая концовка', 'bad',
      [
        'Ты не ответил вовремя. Не потому что плохой — потому что устал, испугался, не знал, что сказать.',
        'Утром его страница была удалена. Через день — вторая. Потом третья.',
        'Ты больше никогда его не видел. Только иногда вспоминал ту ночь и перечитывал его последнее сообщение.',
        '«Я думаю, что лучше просто исчезнуть».'
      ],
      'Иногда одно сообщение — это всё, что нужно.',
      { showEvidenceReport: true, showLegalWarning: true, showPassiveWarning: true }
    );
  } else if (choice === 'паника') {
    addMsg('Чёрт, чёрт, что делать?! Я не знаю, как это остановить!', 'you');
    await wait(SPEED.slow);
    addMsg('Ты тоже не знаешь. Значит, никто не знает. Всё, хватит.', 'danger', 'Дима');
    await wait(SPEED.slow);
    addMsg('Он блокирует тебя.', 'system');
    changeTrust(-40);
    await wait(SPEED.longPause);
    return endScreen(
      'ТИШИНА', 'Плохая концовка', 'bad',
      [
        'Ты был рядом — но твоя паника оказалась громче его боли.',
        'Он не вернулся в колледж. Ни в следующем семестре, ни через год.',
        'Иногда ты видишь его ник в старых чатах — серый, офлайн, навсегда.',
        'Ты не знаешь, что произошло. И это самое страшное — не знать.'
      ],
      'Паника — честная. Но не всегда помогающая.',
      { showEvidenceReport: true, showLegalWarning: true, showPassiveWarning: true }
    );
  }
  await wait(SPEED.pause);
  scene3_5_meeting();
}

async function scene3_5_meeting() {
  state.day = 6; updateHUD(); clearScreen();
  await sequence([
    { text: 'Утро. Ты приходишь в колледж.', type: 'system' },
    { text: 'Дима сидит на подоконнике у окна. Один. Смотрит в телефон.', type: 'system' }
  ], SPEED.base);
  await wait(SPEED.pause);
  addMsg('💭 Подойти? Или сделать вид, что не заметил?', 'thought');
  await wait(SPEED.pause);
  scene3_5_choice();
}

function scene3_5_choice() {
  showChoices([
    { text: '🤝 Сесть рядом и просто молчать', hint: 'Ничего не говорить. Просто быть рядом.', action: () => scene3_5_answer('молчать') },
    { text: '💬 Спросить: «Ты как?»', hint: 'Прямой вопрос.', action: () => scene3_5_answer('спросить') },
    { text: '📱 Показать ему папку с уликами', hint: '«Смотри, что у меня есть. Ты не один в этом».', evidence: true, action: () => scene3_5_answer('показать') },
    { text: '🚶 Пройти мимо', hint: 'Сегодня не твой день. Может, завтра.', danger: true, action: () => scene3_5_answer('мимо') }
  ]);
}

async function scene3_5_answer(choice) {
  clearScreen();
  if (choice === 'молчать') {
    addMsg('Ты садишься рядом. Ничего не говоришь. Просто рядом.', 'system');
    await wait(SPEED.slow);
    addMsg('...спасибо. Что не спрашиваешь «как дела». Я не знаю, что отвечать.', 'author', 'Дима');
    await wait(SPEED.slow);
    addMsg('Я и не спрашиваю.', 'you');
    await wait(SPEED.slow);
    addMsg('Он впервые за неделю улыбается. Чуть-чуть.', 'system');
    changeTrust(15);
  } else if (choice === 'спросить') {
    addMsg('Ты как?', 'you');
    await wait(SPEED.slow);
    addMsg('Как я? Как человек, которому весь колледж желает смерти. Нормально.', 'author', 'Дима');
    await wait(SPEED.slow);
    addMsg('Он отворачивается. Ты понимаешь, что вопрос был глупый.', 'system');
    changeTrust(3);
  } else if (choice === 'показать') {
    addMsg('Смотри. Я собираю доказательства. У меня уже кое-что есть.', 'you');
    await wait(SPEED.slow);
    addMsg('Дима открывает папку. Смотрит. Молчит долго.', 'system');
    await wait(SPEED.slow);
    addMsg('Ты... ты правда это делаешь? Для меня?', 'author', 'Дима');
    await wait(SPEED.slow);
    addMsg('Я не один, что ли?', 'author', 'Дима');
    await wait(SPEED.slow);
    addMsg('Не один.', 'you');
    changeTrust(25);
    state.flags.showedEvidence = true;
    await wait(SPEED.slow);
    addMsg('Кстати, у меня сохранилась запись экрана. Я успел записать, как они выложили адрес.', 'author', 'Дима');
    await wait(SPEED.pause);
    addEvidence('screenrecord');
  } else if (choice === 'мимо') {
    addMsg('Ты проходишь мимо. Делаешь вид, что не заметил.', 'system');
    await wait(SPEED.longPause);
    addMsg('Дима смотрит вслед. Он всё видел.', 'system');
    await wait(SPEED.pause);
    addMsg('💭 Может, завтра. Может, потом. Может, никогда.', 'thought');
    changeTrust(-15);
  }
  await wait(SPEED.pause);
  scene4_start();
}

async function scene4_start() {
  updateHUD(); clearScreen();
  await sequence([
    { text: 'Перемена. К тебе подходит Соня.', type: 'system' },
    { text: 'Она оглядывается — не смотрит ли кто.', type: 'system' }
  ], SPEED.base);
  await wait(SPEED.pause);
  addMsg('Слушай... я видела твою папку в облаке. Ты собираешь доказательства?', 'author', 'Соня');
  await wait(SPEED.slow);
  addMsg('Да. Хочу довести это до конца.', 'you');
  await wait(SPEED.slow);
  addMsg('У меня есть переписка закрытого чата. Никита там всё координирует. Я... я не могу больше это носить.', 'author', 'Соня');
  await wait(SPEED.slow);
  addMsg('💭 Она боится. Если я возьму скрины — стану ответственным. Если не возьму — она может их удалить.', 'thought');
  await wait(SPEED.pause);
  scene4_choice();
}

function scene4_choice() {
  showChoices([
    { text: '📸 Взять скрины', hint: 'Это ключевая улика. Взамен — защитить Соню.', evidence: true, action: () => scene4_answer('взять') },
    { text: '🤐 Отказаться', hint: '«Не хочу, чтобы ты рисковала».', action: () => scene4_answer('отказаться') },
    { text: '👥 Предложить пойти вместе к куратору', hint: 'Ей будет спокойнее, если ты рядом.', action: () => scene4_answer('вместе') }
  ]);
}

async function scene4_answer(choice) {
  clearScreen();
  if (choice === 'взять') {
    addMsg('Спасибо. Я тебя не подставлю. Если что — скажу, что это я нашёл.', 'you');
    await wait(SPEED.slow);
    addMsg('Спасибо... я боюсь, но так легче.', 'author', 'Соня');
    await wait(SPEED.pause);
    addEvidence('witness');
    changeTrust(10);
    state.flags.soniaGaveEvidence = true;
  } else if (choice === 'отказаться') {
    addMsg('Не хочу, чтобы ты рисковала. Если Никита узнает — переключится на тебя.', 'you');
    await wait(SPEED.slow);
    addMsg('...ты прав. Я удалю их, наверное.', 'author', 'Соня');
    await wait(SPEED.pause);
    addMsg('💭 Ты сделал правильно. Но одна улика потеряна навсегда.', 'thought');
  } else if (choice === 'вместе') {
    addMsg('Пойдём вместе. Ты не будешь одна.', 'you');
    await wait(SPEED.slow);
    addMsg('Хорошо. Я согласна.', 'author', 'Соня');
    await wait(SPEED.pause);
    addEvidence('witness');
    changeTrust(15);
    state.flags.soniaGaveEvidence = true;
    state.flags.soniaWitness = true;
  }
  await wait(SPEED.pause);
  scene5_start();
}

async function scene5_start() {
  state.day = 7; updateHUD(); clearScreen();
  await sequence([
    { text: 'День 7. Утро.', type: 'system' },
    { text: 'У тебя есть доверие Димы, доказательства, понимание масштаба.', type: 'system' }
  ], SPEED.base);
  await wait(SPEED.pause);
  addMsg(`📁 В твоей папке: ${state.evidence} ${pluralEvidence(state.evidence)}.`, 'system');
  if (state.evidence >= 3) {
    await wait(SPEED.pause);
    addMsg('💭 Этого хватит для серьёзного разговора. Куратор поможет.', 'thought');
  } else if (state.evidence > 0) {
    await wait(SPEED.pause);
    addMsg('💭 Маловато. Но можно попробовать.', 'thought');
  } else {
    await wait(SPEED.pause);
    addMsg('💭 У тебя почти ничего нет. Придётся действовать иначе.', 'thought');
  }
  await wait(SPEED.pause);
  scene5_choice();
}

function pluralEvidence(n) {
  if (n === 1) return 'улика';
  if (n >= 2 && n <= 4) return 'улики';
  return 'улик';
}

function scene5_choice() {
  const choices = [];
  choices.push({ text: '🔒 Вариант A: «Цифровой детокс»', hint: 'Полное удаление соцсетей.', action: () => scene5_answer('A') });
  choices.push({ text: '🎤 Вариант B: «Публичный ответ»', hint: 'Видеообращение или пост без агрессии.', action: () => scene5_answer('B') });
  if (state.flags.foundNikita) {
    choices.push({ text: '⚔ Вариант C: «Техническая месть»', hint: 'Анонимно слить скелеты Никиты.', danger: true, action: () => scene5_answer('C') });
  }
  if (state.evidence >= 3) {
    choices.push({ text: '🏛 Вариант D: «Системный подход»', hint: `Куратор + психолог + ${state.evidence} ${pluralEvidence(state.evidence)}.`, evidence: true, action: () => scene5_answer('D') });
  } else {
    choices.push({ text: '🏛 Вариант D: «Системный подход» (недоступно)', hint: `Нужно минимум 3 улики. У тебя: ${state.evidence}.`, action: () => { addMsg('💭 Без доказательств сложно. Куратор поможет, но доказательства сильно упростят дело.', 'thought'); scene5_choice(); } });
  }
  showChoices(choices);
}

async function scene5_answer(variant) {
  clearScreen();
  if (variant === 'A') {
    addMsg('Ты предлагаешь Диме полностью уйти из сети.', 'system');
    await wait(SPEED.slow);
    addMsg('Он удаляет все аккаунты. Меняет номер.', 'system');
    await wait(SPEED.slow);
    addMsg('Травля прекращается. Но в реальности он остаётся один.', 'system');
    await wait(SPEED.slow);
    addMsg('Спасибо, что помог. Только... я как будто перестал существовать.', 'author', 'Дима');
    return endScreen(
      'НЕВИДИМКА', 'Нейтральная концовка', 'neutral',
      [
        'Дима выжил. Он в безопасности. Но ты видишь, как он проходит по коридору — и никто не подходит к нему.',
        'Он сдал сессию. Он в порядке. Он один.',
        'Иногда безопасность и одиночество — это одно и то же.'
      ],
      'Иногда спасти — значит спрятать. Но спрятанное не лечится.',
      { showEvidenceReport: true, showPassiveWarning: true }
    );
  }
  if (variant === 'B') {
    addMsg('Вы вместе записываете короткое видео. Без имён. Без агрессии.', 'system');
    await wait(SPEED.slow);
    addMsg('«Меня травили. Пять дней. Я не спал. Я боялся. Но я выжил. Если ты это читаешь — ты не один».', 'author', 'Дима');
    await wait(SPEED.slow);
    addMsg('Видео набирает 10 000 просмотров за сутки.', 'system');
    await wait(SPEED.slow);
    addMsg('Никита удаляет канал. Молча.', 'system');
    return endScreen(
      'ГОЛОС', 'Хорошая концовка', 'good',
      [
        'Дима не стал героем. Он не хотел им быть. Но он перестал быть жертвой.',
        'Через месяц его пригласили в студсовет — вести направление по кибербезопасности.',
        'Травля не исчезла из мира. Но в этом колледже — стало тише.',
        'Ты не сделал ничего особенного. Просто не отвёл взгляд.'
      ],
      'Иногда нужно просто сказать вслух то, что все видят.',
      { showEvidenceReport: true }
    );
  }
  if (variant === 'C') {
    addMsg('Ты используешь свои навыки. Находишь переписки Никиты. Его слабые места.', 'system');
    await wait(SPEED.slow);
    addMsg('Анонимно сливаешь это в тот же канал.', 'danger');
    await wait(SPEED.slow);
    addMsg('Канал удалён. Никита в панике.', 'danger');
    await wait(SPEED.slow);
    addMsg('Но травля не закончилась. Она нашла новую цель.', 'danger');
    await wait(SPEED.slow);
    addMsg('Я не хотел, чтобы кто-то ещё через это прошёл. Даже он.', 'author', 'Дима');
    return endScreen(
      'БУМЕРАНГ', 'Серая концовка', 'neutral',
      [
        'Дима свободен. Никита — нет.',
        'Цикл не разорван. Он просто перевернулся.',
        'Ты выиграл бой. Но проиграл войну.'
      ],
      'Ненависть — это тоже кибербуллинг. Просто с другой стороны.',
      { showEvidenceReport: true, showPassiveWarning: true }
    );
  }

  if (variant === 'D') {
    addMsg('Ты идёшь к куратору. Вместе с Димой. В руках — папка с доказательствами.', 'system');
    await wait(SPEED.slow);

    addMsg('Проходите, ребята. Садитесь. Что случилось?', 'teacher', 'Куратор — Ольга Петровна');
    await wait(SPEED.slow);

    addMsg('Ольга Петровна, мы по поводу травли. Против Димы. Вот доказательства.', 'you');
    await wait(SPEED.slow);

    addMsg('Так. Показывайте.', 'teacher', 'Куратор — Ольга Петровна');
    await wait(SPEED.pause);

    addMsg('Она открывает папку. Смотрит метаданные канала. Читает переписку. Её лицо мрачнеет.', 'system');
    await wait(SPEED.slow);

    addMsg('Это серьёзно. Это уже не «детские шалости». Это уголовная статья. Вы правильно сделали, что пришли.', 'teacher', 'Куратор — Ольга Петровна');
    await wait(SPEED.slow);

    addMsg('Я сейчас же звоню психологу и директору. Дима, ты можешь остаться здесь. Никуда не уходи, хорошо?', 'teacher', 'Куратор — Ольга Петровна');
    await wait(SPEED.slow);

    addMsg('Дима кивает. Впервые за неделю он не смотрит в пол.', 'system');
    await wait(SPEED.pause);

    if (state.evidence >= 4) {
      addMsg('Куратор вызывает Никиту. Через час — собрание с психологом, родителями и директором.', 'system');
      await wait(SPEED.slow);
      addMsg('Никита сначала упирается. Но метаданные, скрины, показания — всё против него.', 'system');
      await wait(SPEED.slow);
      addMsg('Он подписывает признание. Добровольно. В присутствии психолога.', 'system');
      await wait(SPEED.pause);
      addEvidence('confession');
      state.flags.fullJustice = true;

      await wait(SPEED.slow);
      addMsg('Ольга Петровна садится рядом с Димой. Кладёт руку ему на плечо.', 'system');
      await wait(SPEED.slow);
      addMsg('Дима, если тебе понадобится помощь — я всегда здесь. И психолог тоже. Мы разберёмся. Обещаю.', 'teacher', 'Куратор — Ольга Петровна');
      await wait(SPEED.slow);
      addMsg('Спасибо... я не думал, что кто-то вступится.', 'author', 'Дима');
      await wait(SPEED.slow);
      addMsg('Это моя работа. И моя ответственность тоже. Я должна была раньше заметить.', 'teacher', 'Куратор — Ольга Петровна');
    } else {
      addMsg('Куратор вызывает Никиту. Разговор — час. Долгий и жёсткий.', 'system');
      await wait(SPEED.slow);
      addMsg('Канал удалён. Никита извиняется перед группой. Публично.', 'system');
      await wait(SPEED.slow);
      addMsg('Ольга Петровна собирает группу и говорит с каждым. Отдельно.', 'system');
      await wait(SPEED.slow);
      addMsg('Знаете, что самое страшное? Когда все видели — и никто не сказал. Сегодня один человек сказал. И этого хватило.', 'teacher', 'Куратор — Ольга Петровна');
    }

    await wait(SPEED.slow);
    addMsg('Дима возвращается в группу. Он всё ещё тихий. Но он улыбается.', 'system');
    await wait(SPEED.slow);
    addMsg('Ольга Петровна записывает тебя в службу примирения колледжа. Говорит — из тебя выйдет толк.', 'system');

    const extraLine = state.flags.fullJustice
      ? 'Признание Никиты легло в основу дела. Его перевели в другой колледж. А Дима — он теперь ведёт кружок по цифровой безопасности для младших курсов.'
      : 'Никита больше не пишет в чат. Через месяц он перевёлся. А Дима — он постепенно приходит в себя.';

    return endScreen(
      'ТОЧКА ОПОРЫ', 'Лучшая концовка', 'good',
      [
        'Система сработала. Не потому что она идеальная — потому что рядом оказались люди, которым не всё равно.',
        'Куратор не отмахнулась. Она выслушала, поверила и довела дело до конца.',
        extraLine,
        'А ты — ты просто сидел рядом в 3 часа ночи. И этого хватило.'
      ],
      'Иногда достаточно одного человека, который скажет: «Я тебе верю. Давай разберёмся вместе».',
      { showEvidenceReport: true }
    );
  }
}

const soundBtn = document.getElementById('sound-btn');
soundBtn.onclick = () => { const on = Audio.toggle(); soundBtn.textContent = on ? '🔊' : '🔇'; soundBtn.classList.toggle('muted', !on); };

const fsBtn = document.getElementById('fs-btn');
fsBtn.onclick = () => {
  const game = document.getElementById('game');
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (game.requestFullscreen) game.requestFullscreen();
    else if (game.webkitRequestFullscreen) game.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
};

const evidenceBtn = document.getElementById('evidence-btn');
evidenceBtn.onclick = openEvidenceFolder;

document.body.addEventListener('touchstart', () => { Audio.init(); Audio.resume(); }, { once: true });
document.body.addEventListener('click', () => { Audio.init(); Audio.resume(); }, { once: true });

window.onload = async () => { updateHUD(); await startGame(); };
setInterval(() => { if (state.playerName) Save.save(); }, 5000);
window.addEventListener('beforeunload', () => Save.save());
</script>
